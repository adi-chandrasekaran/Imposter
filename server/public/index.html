<!DOCTYPE html>
<html>
<head>
  <title>Imposter Who</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<div id="app">

  <button class="exitBtn" onclick="exitGame()">EXIT</button>

  <!-- SETUP -->
  <div id="setup" class="screen active center">
    <h1>Imposter Who</h1>

    <select id="language">
      <option>English</option>
      <option>Spanish</option>
      <option>French</option>
    </select>

    <input id="word" placeholder="Enter secret word">
    <input id="imposters" type="number" value="1" min="1">

    <button onclick="goToPlayers()">Next</button>
  </div>

  <!-- PLAYERS -->
  <div id="playersScreen" class="screen center">
    <h2>Enter Players</h2>

    <div id="playersList"></div>

    <input id="playerName" placeholder="Player name">
    <button onclick="addPlayer()">Add Player</button>

    <button onclick="startGame()">Start Game</button>
  </div>

  <!-- PASS PHONE -->
  <div id="passScreen" class="screen center">
    <h2 id="currentPlayer"></h2>

    <button 
      id="holdBtn"
      onmousedown="revealWord()"
      onmouseup="hideWord()"
      ontouchstart="revealWord()"
      ontouchend="hideWord()"
    >
      HOLD TO SEE
    </button>

    <h1 id="wordDisplay"></h1>

    <button onclick="nextPlayer()">Next Player</button>
  </div>

  <!-- START -->
  <div id="startScreen" class="screen center">
    <h1 id="starter"></h1>
    <p>Start describing!</p>

    <button onclick="goToVoting()">Go to Voting</button>
  </div>

  <!-- 🆕 VOTING SCREEN -->
  <div id="voteScreen" class="screen center">
    <h2 id="votingPlayer"></h2>
    <div id="voteGrid"></div>

    <button onclick="submitVote()">Submit Vote</button>
  </div>

  <!-- 🆕 RESULT SCREEN -->
  <div id="resultScreen" class="screen center">
    <h1 id="resultText"></h1>

    <button id="continueBtn" onclick="continueRound()">CONTINUE ROUND</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
