<!DOCTYPE html>
<html>
<head>
  <title>Imposter Who</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- SETUP -->
  <div id="setup" class="screen active">
    <h1>Imposter Who</h1>

    <select id="language">
      <option value="english">English</option>
      <option value="spanish">Spanish</option>
      <option value="french">French</option>
    </select>

    <input id="word" placeholder="Enter secret word">
    <input id="imposters" type="number" value="1" min="1">

    <button onclick="goToPlayers()">Next</button>
  </div>

  <!-- PLAYERS -->
  <div id="playersScreen" class="screen">
    <h2>Enter Players</h2>

    <div id="playersList"></div>

    <input id="playerName" placeholder="Player name">
    <button onclick="addPlayer()">Add Player</button>

    <button onclick="startGame()">Start Game</button>
  </div>

  <!-- PASS PHONE -->
  <div id="passScreen" class="screen">
    <h2 id="currentPlayer"></h2>

    <button 
      id="holdBtn"
      onmousedown="revealWord()"
      onmouseup="hideWord()"
      ontouchstart="revealWord()"
      ontouchend="hideWord()"
    >
      HOLD TO SEE
    </button>

    <h1 id="wordDisplay"></h1>

    <button onclick="nextPlayer()">Next Player</button>
  </div>

  <!-- START PLAYER -->
  <div id="startScreen" class="screen">
    <h1 id="starter"></h1>
    <p>Start describing!</p>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
